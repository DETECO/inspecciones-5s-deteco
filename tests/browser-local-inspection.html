<!doctype html>
<html lang="es">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prueba local de inspección · DETECO</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <p style="text-align:center">PRUEBA LOCAL: no guarda en Sheets ni Drive.</p>
  <div class="shell" id="app" aria-live="polite"></div>
  <script>
    window.DETECO_5S_CONFIG = {};
    // Reloj fijo solo de esta prueba local: miércoles dentro del horario laboral.
    const NativeDate = Date;
    window.Date = class extends NativeDate {
      constructor(...args) { super(...(args.length ? args : ['2026-09-30T15:00:00Z'])); }
      static now() { return new NativeDate('2026-09-30T15:00:00Z').getTime(); }
    };
  </script>
  <script type="module" src="./client/app.mjs"></script>
</body>
</html>
